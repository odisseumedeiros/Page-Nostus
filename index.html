<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Finanças Pessoais</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0a16">
  <link rel="icon" href="ic-financas-192.png">
  <link rel="apple-touch-icon" href="ic-financas-180.png">
  <!-- Tailwind (Play CDN) e Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .inp  { @apply w-full mt-1 px-3 py-2 rounded-lg border border-slate-300 dark:border-[#312e4a] bg-white dark:bg-[#0b0a16] text-sm; }
      .btn  { @apply px-3 py-2 rounded-lg border border-slate-300 dark:border-[#312e4a] text-sm font-medium; }
      .btn-p{ @apply bg-violet-500 text-white border-violet-500; }
      .card { @apply bg-white dark:bg-[#12101f] rounded-xl p-4 shadow-sm border border-slate-200 dark:border-[#26233d]; }
      .nav  { @apply flex items-center gap-3 px-3 py-2 rounded-lg text-sm; }
      .ibtn { @apply w-9 h-9 inline-flex items-center justify-center rounded-lg border border-slate-200 dark:border-[#26233d]; }
    }
  </style>
  <style>
    /* Retrato: menu hambúrguer (gaveta) + barra inferior. Tablet, desktop e CELULAR NA HORIZONTAL: barra lateral + grade de 12 colunas. */
    body{background:#f8fafc} .dark body{background:radial-gradient(900px 420px at 50% -8%,rgba(124,58,237,.24),transparent 70%),#0b0a16;background-attachment:fixed}
    #side{display:flex;width:16rem;padding:1rem;overflow-y:auto;transform:translateX(-100%);transition:transform .2s;z-index:60}
    #side.open{transform:none}
    .main-wrap{padding-bottom:6rem}
    .dash{display:grid;gap:.75rem;grid-template-columns:1fr 1fr} .dash>*{min-width:0} .dash>.w{grid-column:1/-1}
    @media (min-width:768px),(orientation:landscape) and (min-width:560px){
      #side{transform:none;width:4rem;padding:.5rem;z-index:30} #side .lbl{display:none} #side .nav{justify-content:center}
      #burger,#scrim{display:none!important} #bottom{display:none} .main-wrap{margin-left:4rem;padding-bottom:2rem}
      .dash{grid-template-columns:repeat(12,1fr);gap:1rem}
      .dash>.k{grid-column:span 3} .dash>.w7{grid-column:span 7} .dash>.w6{grid-column:span 6} .dash>.w5{grid-column:span 5} .dash>.w4{grid-column:span 4}
    }
    @media (min-width:1100px){#side{width:15rem;padding:1rem}#side .lbl{display:inline}#side .nav{justify-content:flex-start}.main-wrap{margin-left:15rem}}
  </style>
</head>
<body class="text-slate-800 dark:text-slate-100 antialiased">
  <div class="min-h-screen">
    <!-- Barra lateral (desktop) -->
    <aside id="side" class="flex fixed inset-y-0 left-0 flex-col gap-1 border-r border-slate-200 dark:border-[#26233d] bg-white dark:bg-[#12101f]"></aside>

    <div class="main-wrap">
      <header class="sticky top-0 z-20 bg-white/90 dark:bg-[#0b0a16]/90 backdrop-blur border-b border-slate-200 dark:border-[#26233d] px-3 py-2 flex flex-wrap items-center gap-2" style="padding-top:max(.5rem,env(safe-area-inset-top))">
        <button id="burger" data-a="drawer" class="ibtn" aria-label="Menu"></button>
        <div class="mr-auto min-w-0"><h1 id="title" class="font-semibold text-base sm:text-lg leading-tight truncate"></h1><p id="subtitle" class="text-[11px] text-neutral-400 truncate"></p></div>
        <button id="sbtn" data-a="search" class="ibtn" aria-label="Pesquisar transação"></button>
        <div id="sync" class="flex items-center gap-1.5 text-xs" aria-live="polite"></div>
        <button id="syncBtn" class="ibtn"></button>
        <div class="basis-full sm:basis-auto "><input type="month" id="month" class="inp !w-auto !mt-0 !py-1" aria-label="Filtro de mês"></div>
      </header>
      <main id="view" class="p-4 max-w-5xl mx-auto"></main>
    </div>
  </div>

  <!-- Navegação inferior (mobile) -->
  <nav id="bottom" class="fixed bottom-0 inset-x-0 z-30 flex justify-around bg-white dark:bg-[#12101f] border-t border-slate-200 dark:border-[#26233d]" style="padding-bottom:env(safe-area-inset-bottom)"></nav>

  <button id="fab" data-a="new-tx" aria-label="Nova transação" class="fixed right-4 bottom-20 md:bottom-6 w-14 h-14 rounded-full bg-violet-500 text-white text-3xl shadow-lg z-30">+</button>
  <div id="scrim" data-a="drawer" class="hidden fixed inset-0 bg-black/60 z-[55]"></div>
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end md:items-center justify-center md:p-4"></div>
  <input type="file" id="imp" accept=".json,application/json" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
